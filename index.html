<!doctype html>
<html lang="ky">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#100b08">
    <title>Асхаттын туулган күнүнө чакыруу</title>
    <meta property="og:title" content="Асхаттын туулган күнүнө чакыруу ✨">
    <meta property="og:description" content="Сизге атайын чакыруу келди. Көрүү үчүн басыңыз!">
    <meta property="og:image" content="https://i.ibb.co/Jjyxc3VV/2-6.jpg"> 
    <meta property="og:url" content="https://kianyr44.github.io/massage/">
    <style>
        :root {
            color-scheme: dark
        }

        * {
            box-sizing: border-box
        }

        html, body {
            margin: 0;
            min-height: 100%;
            font-family: Georgia,'Times New Roman',serif;
            background: radial-gradient(ellipse at 50% 25%,#49301b 0,#1c120c 42%,#080706 100%);
            color: #f7d58b
        }

        body {
            min-height: 100svh;
            display: grid;
            place-items: center;
            padding: 22px;
            overflow-x: hidden
        }

        .scene {
            width: min(100%,440px);
            text-align: center
        }

        .hint {
            font: 500 12px/1.5 system-ui,sans-serif;
            letter-spacing: .22em;
            text-transform: uppercase;
            color: #d5b477;
            margin: 0 0 24px
        }

        .envelope-wrap {
            position: relative;
            width: min(86vw,360px);
            height: 260px;
            margin: 0 auto 22px;
            perspective: 1000px;
            filter: drop-shadow(0 24px 26px #0009);
            cursor: pointer
        }

        .envelope {
            position: absolute;
            inset: 0;
            background: linear-gradient(145deg,#3b2617,#120d09 75%);
            border: 1px solid #b8863d;
            border-radius: 7px;
            overflow: visible
        }

            .envelope:before, .envelope:after {
                content: "";
                position: absolute;
                inset: 0;
                pointer-events: none
            }

            .envelope:before {
                background: linear-gradient(32deg,transparent 49.5%,#9c6d2f 50%,transparent 50.5%),linear-gradient(-32deg,transparent 49.5%,#9c6d2f 50%,transparent 50.5%);
                opacity: .75
            }

        .flap {
            position: absolute;
            z-index: 4;
            left: 0;
            top: 0;
            width: 100%;
            height: 62%;
            transform-origin: top center;
            clip-path: polygon(0 0,100% 0,50% 100%);
            background: linear-gradient(145deg,#b9853b,#4d2e14 78%);
            border-top: 1px solid #f3cd7d;
            transition: transform 1s cubic-bezier(.2,.7,.2,1),z-index .1s .45s;
            backface-visibility: hidden
        }

        .seal {
            position: absolute;
            z-index: 5;
            left: 50%;
            top: 47%;
            transform: translate(-50%,-50%);
            width: 58px;
            height: 58px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            background: radial-gradient(circle at 35% 30%,#ffe7a6,#b77a2b 58%,#633a16);
            color: #2a1709;
            font-size: 27px;
            box-shadow: 0 3px 12px #0008;
            border: 1px solid #f7d58b;
            transition: opacity .35s,transform .45s
        }

        .envelope-label {
            position: absolute;
            z-index: 2;
            inset: auto 0 28px;
            text-align: center;
            color: #f1ce8b;
            font-size: 22px;
            letter-spacing: .05em;
            text-shadow: 0 2px 8px #000
        }

            .envelope-label small {
                display: block;
                font: 11px system-ui,sans-serif;
                letter-spacing: .25em;
                margin-top: 8px;
                color: #c39b5c
            }

        .open-btn {
            border: 1px solid #d5a653;
            border-radius: 999px;
            background: linear-gradient(135deg,#f2d18e,#a66d25);
            color: #241507;
            padding: 13px 25px;
            font: 600 14px system-ui,sans-serif;
            letter-spacing: .04em;
            box-shadow: 0 8px 24px #0007;
            cursor: pointer
        }

            .open-btn:active {
                transform: scale(.98)
            }

        .sub {
            font: 12px system-ui,sans-serif;
            color: #bda276;
            margin-top: 16px
        }

        .letter {
            display: none;
            width: min(100%,390px);
            margin: 0 auto;
            opacity: 0;
            transform: translateY(35px) scale(.96);
            transition: opacity .8s .45s,transform .8s .45s
        }

            .letter img {
                display: block;
                width: 100%;
                height: auto;
                border-radius: 5px;
                box-shadow: 0 18px 55px #000b;
                border: 1px solid #bd8b43
            }

        .again {
            margin-top: 18px;
            border: 1px solid #8f6a37;
            background: #1b120b;
            color: #e9c783;
            border-radius: 999px;
            padding: 10px 18px;
            font: 12px system-ui,sans-serif;
            cursor: pointer
        }

        .scene.opening .flap {
            transform: rotateX(180deg);
            z-index: 1
        }

        .scene.opening .seal {
            opacity: 0;
            transform: translate(-50%,-50%) scale(.4)
        }

        .scene.opening .envelope-wrap {
            transition: opacity .6s .55s,transform .7s .55s;
            opacity: 0;
            transform: translateY(28px) scale(.9);
            pointer-events: none
        }

        .scene.opening .hint, .scene.opening .open-btn, .scene.opening .sub {
            opacity: 0;
            transition: opacity .3s
        }

        .scene.opening .letter {
            display: block
        }

        .scene.opened .letter {
            opacity: 1;
            transform: translateY(0) scale(1)
        }

        .scene.opened .envelope-wrap {
            display: none
        }

        .scene.opened .hint {
            display: none
        }

        .scene.opened .open-btn, .scene.opened .sub {
            display: none
        }

        .scene.opened .letter {
            display: block
        }

        @media(prefers-reduced-motion:reduce) {
            * {
                transition: none !important
            }
        }
    </style>
</head>
<body>
<main class="scene" id="scene">
  <p class="hint">Сизге атайын чакыруу келди</p>
  <div class="envelope-wrap" id="envelope" role="button" tabindex="0" aria-label="Конвертти ачуу">
    <div class="envelope">
      <div class="flap"></div>
      <div class="seal">♛</div>
      <div class="envelope-label">Асхаттан чакыруу<small>WITH LOVE & WARM WISHES</small></div>
    </div>
  </div>
  <button class="open-btn" id="openBtn" type="button">Конвертти ачуу ✨</button>
  <p class="sub">Чакыруу катын көрүү үчүн басыңыз</p>
  <section class="letter" id="letter" aria-label="Туулган күнгө чакыруу">
    <img src="https://i.ibb.co/QvVX8d8z/Gemini-Generated-Image-e1ywshe1ywshe1yw.jpg" alt="Асхаттын туулган күнүнө чакыруу: 28-ноябрь, саат 15:00, Арашан айылы">
    <button class="again" id="againBtn" type="button">↻ Кайра көрүү</button>
  </section>
</main>
<script>
const scene=document.getElementById('scene');
function openLetter(){if(scene.classList.contains('opened')||scene.classList.contains('opening'))return;scene.classList.add('opening');setTimeout(()=>scene.classList.add('opened'),1050)}
document.getElementById('openBtn').addEventListener('click',openLetter);
document.getElementById('envelope').addEventListener('click',openLetter);
document.getElementById('envelope').addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openLetter()}});
document.getElementById('againBtn').addEventListener('click',()=>{scene.classList.remove('opened','opening')});
</script>
</body></html>
